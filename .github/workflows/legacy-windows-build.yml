name: Legacy Windows build

on:
  push:
    branches:
      - main
      - refactor/windows-portable-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-legacy:
    name: Build legacy .NET Framework solution
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "Source Server/DDTank 4.1.sln" -NonInteractive

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "Source Server/DDTank 4.1.sln" /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Upload legacy build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ddtank-legacy-build
          path: |
            Source Server/**/bin/Release/**
            Source Server/Road.Service/bin/Release/**
          if-no-files-found: warn
          retention-days: 14

  build-localdata:
    name: Build and test embedded SQLite foundation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local database library
        run: dotnet restore LocalData/DDTank.LocalData.csproj

      - name: Build local database library
        run: dotnet build LocalData/DDTank.LocalData.csproj --configuration Release --no-restore

      - name: Run SQLite initialization, persistence, and backup smoke test
        run: dotnet run --project LocalData.SmokeTest/LocalData.SmokeTest.csproj --configuration Release


  build-webmodern:
    name: Build replacement ASP.NET Core web host
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebModern/DDTank.Web.csproj

      - name: Build Release
        run: dotnet build WebModern/DDTank.Web.csproj --configuration Release --no-restore

      - name: Publish self-contained win-x64
        run: dotnet publish WebModern/DDTank.Web.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/WebModern

      - name: Upload portable web host
        uses: actions/upload-artifact@v4
        with:
          name: ddtank-webmodern-win-x64
          path: artifacts/WebModern/**
          if-no-files-found: error
          retention-days: 14
