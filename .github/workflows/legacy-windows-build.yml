name: Legacy Windows build

on:
  push:
    branches:
      - main
      - refactor/windows-portable-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-legacy:
    name: Build legacy .NET Framework solution
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "Source Server/DDTank 4.1.sln" -NonInteractive

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "Source Server/DDTank 4.1.sln" /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Upload legacy build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ddtank-legacy-build
          path: |
            Source Server/**/bin/Release/**
            Source Server/Road.Service/bin/Release/**
          if-no-files-found: warn
          retention-days: 14

  build-character-reference-seed:
    name: Build filtered SQLite character reference seed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ephemeral SQL Server 2022
        run: |
          PASSWORD="$(python3 -c 'import secrets; print("Aa9!" + secrets.token_urlsafe(24) + "Z7#")')"
          echo "::add-mask::$PASSWORD"
          echo "MSSQL_SA_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          docker run --name ddtank-sqlserver-inspect \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$PASSWORD" \
            -p 1433:1433 -d mcr.microsoft.com/mssql/server:2022-latest

          for attempt in $(seq 1 60); do
            if docker exec ddtank-sqlserver-inspect \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker logs ddtank-sqlserver-inspect
          exit 1

      - name: Restore backups and build filtered SQLite seed
        run: python3 scripts/db-inspection/inspect_backups.py

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate actual seed and first-character migration
        run: dotnet run --project LocalData.SmokeTest/LocalData.SmokeTest.csproj --configuration Release -- artifacts/database-inspection/character-reference-seed.sqlite3

      - name: Upload character reference seed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ddtank-character-reference-seed
          path: artifacts/database-inspection/character-reference-seed.sqlite3
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral SQL Server
        if: always()
        run: docker rm -f ddtank-sqlserver-inspect || true

  build-localdata:
    name: Build and test embedded SQLite foundation
    needs: build-character-reference-seed
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actual character reference seed
        uses: actions/download-artifact@v4
        with:
          name: ddtank-character-reference-seed
          path: artifacts/database-inspection

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local database library
        run: dotnet restore LocalData/DDTank.LocalData.csproj

      - name: Build local database library
        run: dotnet build LocalData/DDTank.LocalData.csproj --configuration Release --no-restore

      - name: Run SQLite account and first-character smoke test with actual seed
        run: dotnet run --project LocalData.SmokeTest/LocalData.SmokeTest.csproj --configuration Release -- artifacts/database-inspection/character-reference-seed.sqlite3


  build-webmodern:
    name: Build replacement ASP.NET Core web host
    needs: build-character-reference-seed
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download character reference seed for portable host
        uses: actions/download-artifact@v4
        with:
          name: ddtank-character-reference-seed
          path: WebModern/Seeds

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebModern/DDTank.Web.csproj

      - name: Build Release
        run: dotnet build WebModern/DDTank.Web.csproj --configuration Release --no-restore

      - name: Publish self-contained win-x64
        run: dotnet publish WebModern/DDTank.Web.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/WebModern

      - name: Smoke test published host with bundled SQLite seed
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts\WebModern\DDTank.Web.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "artifacts\WebModern") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $info = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/v1/server/info" -TimeoutSec 2
                if ($info.database -eq "SQLite" -and $info.databaseReady -eq $true) {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:5080/health/ready" -TimeoutSec 2
                  if ($health -eq "Healthy") {
                    $ready = $true
                    break
                  }
                }
              } catch {
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "Published portable web host did not become ready with its bundled SQLite seed."
            }
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload portable web host
        uses: actions/upload-artifact@v4
        with:
          name: ddtank-webmodern-win-x64
          path: artifacts/WebModern/**
          if-no-files-found: error
          retention-days: 14
